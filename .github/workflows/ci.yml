name: CI - Souzas Desk

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-tests:
    name: PowerShell 5.1 - Quality Checks
    runs-on: windows-2022
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Verificar PowerShell
        shell: powershell
        run: |
          $v = $PSVersionTable.PSVersion
          Write-Host "PowerShell: $v"
          if ($v.Major -ne 5 -or $v.Minor -ne 1) {
            throw 'PowerShell 5.1 esperado'
          }

      - name: Testar execucao e auditoria
        shell: powershell
        run: |
          & .\tests\Action.Tests.ps1
          if (-not $?) { exit 1 }
      - name: Executar testes
        shell: powershell
        run: |
          & .\tests\Smoke.Tests.ps1
          if (-not $?) { exit 1 }

      - name: Testar auditoria CSV real
        shell: powershell
        run: |
          & .\tests\Audit.Integration.Tests.ps1
          if (-not $?) { exit 1 }

      - name: Instalar PSScriptAnalyzer
        shell: powershell
        run: |
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          if (-not (Get-PackageProvider -ListAvailable -Name NuGet -ErrorAction SilentlyContinue)) {
            Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Scope CurrentUser -Force | Out-Null
          }
          Install-Module -Name PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Repository PSGallery -Force -ErrorAction Stop

      - name: Executar PSScriptAnalyzer
        shell: powershell
        run: |
          & .\tests\Lint.Tests.ps1
          if (-not $?) { exit 1 }

